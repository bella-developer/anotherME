# =============================================================================
# Render Deployment Configuration for anotherME Backend
# =============================================================================
# This file configures the backend deployment on Render's free tier
# Documentation: https://render.com/docs/yaml-spec
# =============================================================================

services:
  # Backend API Service
  - type: web
    name: anotherme-backend
    env: node
    region: oregon # Choose region closest to your users
    plan: free # Free tier with cold starts
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    
    # Environment Variables
    # IMPORTANT: Set these in Render Dashboard for security
    # Do NOT commit sensitive values to this file
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 5000
      
      # MongoDB Configuration
      # Set this in Render Dashboard with your actual connection string
      - key: MONGODB_URI
        sync: false # Must be set manually in dashboard
      
      # JWT Secrets
      # Generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      # Set these in Render Dashboard
      - key: JWT_ACCESS_SECRET
        sync: false # Must be set manually in dashboard
      
      - key: JWT_REFRESH_SECRET
        sync: false # Must be set manually in dashboard
      
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      
      # CORS Configuration
      # Update with your actual Vercel frontend URL
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      - key: RATE_LIMIT_MAX_WRITE_REQUESTS
        value: 30
      
      - key: RATE_LIMIT_MAX_SENSITIVE_REQUESTS
        value: 10
      
      # Security
      - key: FORCE_HTTPS
        value: true
      
      - key: ENABLE_REQUEST_LOGGING
        value: true
      
      # Database Configuration
      - key: MONGODB_POOL_SIZE
        value: 10
      
      - key: MONGODB_CONNECT_TIMEOUT
        value: 10000
      
      # Cache Configuration
      - key: CACHE_TTL_FEEDS
        value: 300
      
      - key: CACHE_TTL_CIRCLES
        value: 600
      
      # Content Configuration
      - key: MAX_POST_LENGTH
        value: 5000
      
      - key: MIN_POST_LENGTH
        value: 10
      
      - key: MAX_COMMENT_LENGTH
        value: 1000
      
      - key: MAX_COMMENT_DEPTH
        value: 3
      
      # Health Check
      - key: HEALTH_CHECK_PATH
        value: /api/health
      
      - key: SHUTDOWN_TIMEOUT
        value: 10000
    
    # Auto-deploy settings
    autoDeploy: true
    
    # Health check configuration
    healthCheck:
      path: /api/health
      interval: 30 # Check every 30 seconds
      timeout: 10 # Timeout after 10 seconds
      unhealthyThreshold: 3 # Mark unhealthy after 3 failures
      healthyThreshold: 2 # Mark healthy after 2 successes

# =============================================================================
# Deployment Instructions
# =============================================================================
# 1. Create a new Web Service on Render
# 2. Connect your GitHub repository
# 3. Set the root directory to "backend"
# 4. Render will automatically detect this render.yaml file
# 5. Set sensitive environment variables in the Render Dashboard:
#    - MONGODB_URI (your MongoDB Atlas connection string)
#    - JWT_ACCESS_SECRET (64-character random string)
#    - JWT_REFRESH_SECRET (64-character random string, different from access)
# 6. Update CORS_ORIGIN with your actual Vercel frontend URL
# 7. Deploy!
#
# Free Tier Limitations:
# - Service spins down after 15 minutes of inactivity (cold starts)
# - 750 hours/month of runtime
# - Shared CPU and 512MB RAM
# - No persistent disk storage (use MongoDB for all data)
#
# Monitoring:
# - Health checks run every 30 seconds
# - View logs in Render Dashboard
# - Set up alerts for service failures
# =============================================================================
