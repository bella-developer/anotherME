<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep dark nebula gradients -->
    <radialGradient id="darkNebula1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#0f0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#08050f;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="darkNebula2" cx="70%" cy="30%">
      <stop offset="0%" style="stop-color:#0a0814;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#05030a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="darkNebula3" cx="50%" cy="75%">
      <stop offset="0%" style="stop-color:#0d0a15;stop-opacity:0.85" />
      <stop offset="50%" style="stop-color:#060508;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>

    <!-- Very subtle purple/blue fog -->
    <radialGradient id="fog1" cx="40%" cy="50%">
      <stop offset="0%" style="stop-color:#1a0f2e;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#0a050f;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="fog2" cx="65%" cy="45%">
      <stop offset="0%" style="stop-color:#0f1a2e;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#05080f;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Dim star glow -->
    <filter id="dimGlow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Pure black space -->
  <rect width="1920" height="1080" fill="#000000"/>
  
  <!-- Deep dark nebula clouds -->
  <ellipse cx="580" cy="420" rx="700" ry="500" fill="url(#darkNebula1)" opacity="0.6"/>
  <ellipse cx="1340" cy="320" rx="650" ry="550" fill="url(#darkNebula2)" opacity="0.5"/>
  <ellipse cx="960" cy="780" rx="700" ry="400" fill="url(#darkNebula3)" opacity="0.55"/>
  
  <!-- Mysterious fog layers -->
  <ellipse cx="770" cy="540" rx="500" ry="380" fill="url(#fog1)" opacity="0.4"/>
  <ellipse cx="1250" cy="500" rx="480" ry="420" fill="url(#fog2)" opacity="0.35"/>
  
  <!-- Dim distant stars - very faint -->
  <circle cx="180" cy="140" r="1.2" fill="#6a7a9a" opacity="0.4" filter="url(#dimGlow)"/>
  <circle cx="450" cy="95" r="1" fill="#7a8aaa" opacity="0.35" filter="url(#dimGlow)"/>
  <circle cx="890" cy="165" r="1.3" fill="#8a9aba" opacity="0.4" filter="url(#dimGlow)"/>
  <circle cx="1250" cy="115" r="1.1" fill="#7a8aaa" opacity="0.38" filter="url(#dimGlow)"/>
  <circle cx="1690" cy="205" r="1" fill="#6a7a9a" opacity="0.35" filter="url(#dimGlow)"/>
  
  <!-- Medium dim stars -->
  <circle cx="310" cy="350" r="0.8" fill="#5a6a8a" opacity="0.35"/>
  <circle cx="620" cy="490" r="0.9" fill="#6a7a9a" opacity="0.38"/>
  <circle cx="780" cy="310" r="0.75" fill="#5a6a8a" opacity="0.33"/>
  <circle cx="1100" cy="570" r="0.85" fill="#7a8aaa" opacity="0.36"/>
  <circle cx="1430" cy="470" r="0.8" fill="#6a7a9a" opacity="0.35"/>
  <circle cx="1780" cy="430" r="0.75" fill="#5a6a8a" opacity="0.33"/>
  
  <!-- Small scattered stars - barely visible -->
  <circle cx="100" cy="690" r="0.6" fill="#4a5a7a" opacity="0.3"/>
  <circle cx="360" cy="760" r="0.5" fill="#5a6a8a" opacity="0.28"/>
  <circle cx="560" cy="810" r="0.65" fill="#4a5a7a" opacity="0.3"/>
  <circle cx="820" cy="730" r="0.55" fill="#5a6a8a" opacity="0.28"/>
  <circle cx="1000" cy="950" r="0.6" fill="#4a5a7a" opacity="0.3"/>
  <circle cx="1220" cy="890" r="0.5" fill="#5a6a8a" opacity="0.28"/>
  <circle cx="1500" cy="830" r="0.65" fill="#4a5a7a" opacity="0.3"/>
  <circle cx="1740" cy="950" r="0.55" fill="#5a6a8a" opacity="0.28"/>
  <circle cx="1860" cy="690" r="0.6" fill="#4a5a7a" opacity="0.3"/>
  
  <!-- Tiny distant stars - almost invisible -->
  <circle cx="240" cy="930" r="0.4" fill="#3a4a6a" opacity="0.25"/>
  <circle cx="500" cy="990" r="0.35" fill="#4a5a7a" opacity="0.23"/>
  <circle cx="740" cy="550" r="0.4" fill="#3a4a6a" opacity="0.25"/>
  <circle cx="980" cy="430" r="0.35" fill="#4a5a7a" opacity="0.23"/>
  <circle cx="1160" cy="750" r="0.4" fill="#3a4a6a" opacity="0.25"/>
  <circle cx="1380" cy="630" r="0.35" fill="#4a5a7a" opacity="0.23"/>
  <circle cx="1620" cy="1010" r="0.4" fill="#3a4a6a" opacity="0.25"/>
  <circle cx="1800" cy="790" r="0.35" fill="#4a5a7a" opacity="0.23"/>
  
  <!-- More micro stars for atmospheric depth -->
  <circle cx="135" cy="460" r="0.3" fill="#2a3a5a" opacity="0.2"/>
  <circle cx="395" cy="590" r="0.3" fill="#3a4a6a" opacity="0.18"/>
  <circle cx="675" cy="260" r="0.3" fill="#2a3a5a" opacity="0.2"/>
  <circle cx="855" cy="900" r="0.3" fill="#3a4a6a" opacity="0.18"/>
  <circle cx="1035" cy="220" r="0.3" fill="#2a3a5a" opacity="0.2"/>
  <circle cx="1275" cy="350" r="0.3" fill="#3a4a6a" opacity="0.18"/>
  <circle cx="1465" cy="960" r="0.3" fill="#2a3a5a" opacity="0.2"/>
  <circle cx="1665" cy="570" r="0.3" fill="#3a4a6a" opacity="0.18"/>
  <circle cx="1835" cy="300" r="0.3" fill="#2a3a5a" opacity="0.2"/>
</svg>
