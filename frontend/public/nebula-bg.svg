<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebula1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f1e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="30%">
      <stop offset="0%" style="stop-color:#1e1a2e;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#0a0a1a;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="70%">
      <stop offset="0%" style="stop-color:#1a1a28;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#0d0d18;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" />
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <!-- Base space -->
  <rect width="1920" height="1080" fill="#000000"/>
  
  <!-- Nebula clouds -->
  <ellipse cx="600" cy="400" rx="500" ry="350" fill="url(#nebula1)" opacity="0.7" filter="url(#noise)"/>
  <ellipse cx="1350" cy="300" rx="450" ry="400" fill="url(#nebula2)" opacity="0.6" filter="url(#noise)"/>
  <ellipse cx="960" cy="750" rx="550" ry="300" fill="url(#nebula3)" opacity="0.5" filter="url(#noise)"/>
  
  <!-- Stars layer 1 - large -->
  <circle cx="150" cy="120" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="420" cy="80" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="890" cy="150" r="1.3" fill="#ffffff" opacity="0.85"/>
  <circle cx="1200" cy="90" r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="1650" cy="200" r="1.2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Stars layer 2 - medium -->
  <circle cx="250" cy="300" r="0.9" fill="#ffffff" opacity="0.7"/>
  <circle cx="580" cy="450" r="1" fill="#ffffff" opacity="0.75"/>
  <circle cx="720" cy="280" r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="1050" cy="520" r="1" fill="#ffffff" opacity="0.75"/>
  <circle cx="1380" cy="420" r="0.9" fill="#ffffff" opacity="0.7"/>
  <circle cx="1720" cy="380" r="0.8" fill="#ffffff" opacity="0.7"/>
  
  <!-- Stars layer 3 - small scattered -->
  <circle cx="100" cy="600" r="0.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="680" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="520" cy="720" r="0.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="780" cy="650" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="950" cy="900" r="0.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="1150" cy="820" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1420" cy="750" r="0.6" fill="#ffffff" opacity="0.6"/>
  <circle cx="1680" cy="880" r="0.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1820" cy="620" r="0.6" fill="#ffffff" opacity="0.6"/>
  
  <!-- Distant stars -->
  <circle cx="200" cy="850" r="0.4" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="920" r="0.3" fill="#ffffff" opacity="0.3"/>
  <circle cx="680" cy="480" r="0.4" fill="#ffffff" opacity="0.4"/>
  <circle cx="920" cy="380" r="0.3" fill="#ffffff" opacity="0.3"/>
  <circle cx="1100" cy="680" r="0.4" fill="#ffffff" opacity="0.4"/>
  <circle cx="1320" cy="580" r="0.3" fill="#ffffff" opacity="0.3"/>
  <circle cx="1550" cy="950" r="0.4" fill="#ffffff" opacity="0.4"/>
  <circle cx="1750" cy="720" r="0.3" fill="#ffffff" opacity="0.3"/>
</svg>
