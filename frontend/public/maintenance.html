<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESO - Maintenance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: rgba(255,255,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-size: 48px;
      font-weight: 200;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.9);
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    p {
      font-size: 14px;
      letter-spacing: 0.08em;
      line-height: 1.8;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
    }
    .line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.2), transparent);
      margin: 32px auto;
    }
    .small {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      margin-top: 48px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESO</h1>
    <div class="line"></div>
    <p>We're taking a moment of silence.</p>
    <p>The space will breathe again soon.</p>
    <p class="small">Back tomorrow</p>
  </div>
</body>
</html>
