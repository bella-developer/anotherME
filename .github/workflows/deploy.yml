name: Deploy to Vercel and Render

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual deployment

jobs:
  # Frontend deployment is handled by Vercel's GitHub integration
  # This job is just for logging
  frontend-status:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend Deployment Info
        run: |
          echo "🚀 Frontend deployment to Vercel is handled automatically"
          echo "📦 Vercel will build and deploy from the 'frontend' directory"
          echo "🔗 Check deployment status in your Vercel dashboard"

  # Backend deployment is handled by Render's GitHub integration
  # This job is just for logging
  backend-status:
    runs-on: ubuntu-latest
    steps:
      - name: Backend Deployment Info
        run: |
          echo "🚀 Backend deployment to Render is handled automatically"
          echo "📦 Render will build and deploy from the 'backend' directory"
          echo "🔗 Check deployment status in your Render dashboard"
      
      - name: Wait for Deployment
        run: |
          echo "⏳ Waiting 60 seconds for deployment to complete..."
          sleep 60
      
      - name: Health Check
        if: always()
        run: |
          echo "🏥 Checking backend health..."
          if [ ! -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_BACKEND_URL }}/api/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Backend is healthy!"
            else
              echo "⚠️  Backend health check returned: $response"
            fi
          else
            echo "ℹ️  RENDER_BACKEND_URL secret not set, skipping health check"
          fi
