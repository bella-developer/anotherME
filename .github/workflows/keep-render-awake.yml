name: Keep Render Server Awake

on:
  schedule:
    # Run every 8 minutes to prevent Render free tier from sleeping
    - cron: '*/8 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if secret is configured
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "❌ RENDER_BACKEND_URL secret is not configured"
            echo "Please add the secret in GitHub repository settings:"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: RENDER_BACKEND_URL"
            echo "Value: https://anotherme-backend.onrender.com"
            exit 1
          fi
          echo "✅ Secret is configured"
      
      - name: Ping Render Server
        run: |
          echo "Pinging server at $(date)"
          echo "URL: ${{ secrets.RENDER_BACKEND_URL }}/api/health"
          
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 30 ${{ secrets.RENDER_BACKEND_URL }}/api/health || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Server is awake and healthy (HTTP $response)"
          elif [ "$response" = "000" ]; then
            echo "❌ Failed to reach server (timeout or connection error)"
            echo "This might be a cold start - server may be waking up"
            # Don't fail on first attempt - Render might be cold starting
            sleep 10
            response=$(curl -s -o /dev/null -w "%{http_code}" -m 30 ${{ secrets.RENDER_BACKEND_URL }}/api/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Server is now awake (HTTP $response)"
            else
              echo "❌ Server still unreachable after retry"
              exit 1
            fi
          else
            echo "⚠️  Server responded with HTTP $response"
          fi
      
      - name: Log Result
        if: always()
        run: |
          echo "Ping completed at $(date)"
          echo "This workflow runs every 8 minutes to keep Render free tier active"
