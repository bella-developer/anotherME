name: Keep Render Server Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Server
        run: |
          echo "Pinging server at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.RENDER_BACKEND_URL }}/api/health || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Server is awake and healthy (HTTP $response)"
          elif [ "$response" = "000" ]; then
            echo "❌ Failed to reach server"
            exit 1
          else
            echo "⚠️  Server responded with HTTP $response"
          fi
      
      - name: Log Result
        if: always()
        run: |
          echo "Ping completed at $(date)"
          echo "This workflow runs every 10 minutes to keep Render free tier active"
